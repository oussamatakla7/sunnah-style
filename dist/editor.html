<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة سنّة ستايل</title><style>
[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;background:#f7f3eb;color:#12362c;font:16px system-ui}header,main{padding:1rem}header{background:#12362c;color:white;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}button,select,input,textarea{font:inherit;padding:.55rem;border:1px solid #b6c0b8;border-radius:.35rem}button{cursor:pointer;background:#12362c;color:white}header button{background:white;color:#12362c}label{display:grid;gap:.3rem}form,aside{display:grid;gap:.65rem}section{margin:0 auto;max-width:1250px}.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:1rem}iframe{width:100%;height:75vh;border:1px solid #ccc;background:white}textarea{width:100%;min-height:5rem}.row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}.variant{padding:.6rem;border:1px solid #ccc;display:grid;gap:.4rem}img{max-width:110px}small{display:block}@media(max-width:680px){.layout{grid-template-columns:1fr}}
</style><header><strong>لوحة سنّة ستايل</strong><button data-tab="pages">تصميم الصفحات</button><button data-tab="products">المنتجات</button></header><main><div class="row"><button id="save" disabled>حفظ مسودّة</button><button id="publish" disabled>نشر على المتجر</button><a href="/signout-with-chatgpt?return_to=%2F">تسجيل الخروج</a></div><p id="status" role="status"></p>
<section id="pages" class="layout"><aside><label>الصفحة<select id="page"><option value="index">الرئيسية</option><option value="shop">المتجر</option><option value="contact">تواصلي معنا</option></select></label><label>العنصر<select id="element"></select></label><label>النص أو رابط الصورة<textarea id="content"></textarea></label><label>رفع صورة للعنصر<input id="page-image" type="file" accept="image/*"></label><label>لون النص<input id="ink" type="color"></label><label>لون الخلفية<input id="fill" type="color" value="#faf7f0"></label><label>حجم النص بالبكسل<input id="font" type="number" min="10" max="120"></label><label>المسافة الداخلية بالبكسل<input id="padding" type="number" min="0" max="150"></label><button id="apply">حفظ تعديل العنصر</button><div class="row"><button id="up">تحريك القسم لأعلى</button><button id="down">تحريك القسم لأسفل</button></div></aside><iframe id="preview" title="معاينة الصفحة" sandbox="allow-same-origin"></iframe></section>
<section id="products" hidden><div class="row"><label>المنتجات<select id="product"></select></label><button id="new">إضافة منتج</button></div><form id="product-form"><div class="row"><label>رمز القطعة<input id="sku" required pattern="[A-Za-z0-9_-]+"></label><label>اسم القطعة<input id="name" required></label><label>الفئة<select id="category"><option value="1">فساتين سهرة</option><option value="2">فساتين يومية</option><option value="3">أطقم رياضية</option></select></label></div><label>الوصف<textarea id="description"></textarea></label><div class="row"><label>السعر بالدولار<input id="price" required type="number" min="0" step=".01"></label><label>الكمية<input id="quantity" type="number" min="0" step="1"></label><label><span>سعر مؤقّت</span><input id="temporary" type="checkbox"></label></div><label>صورة المنتج<input id="image" type="file" accept="image/*"></label><img id="thumb" alt=""><div id="variants"></div><div class="row"><button type="button" id="add-color">إضافة لون</button><button type="submit">حفظ المنتج</button><button type="button" id="delete">حذف المنتج</button></div></form></section></main><script defer src="/catalog.js"></script><script defer src="editor.js"></script></html>
